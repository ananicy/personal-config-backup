# | Environment Variables |
# Set your environment variables here. | https://mangowm.github.io/docs/configuration/basics#environment-variables

env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME_QT6,qt6ct
 #env = WLR_SCENE_DISABLE_DIRECT_SCANOUT,1
 #env = WLR_DRM_NO_ATOMIC,1
 #WLR_DRM_DEVICES=/dev/dri/card0:/dev/dri/card1 mango
 #WLR_DRM_DEVICES=/dev/dri/card0 mango
 #env = WLR_RENDERER,vulkan

# | Outputs Configuration |
# Configure your monitors here or in the DMS "Displays" settings. | https://mangowm.github.io/docs/configuration/monitors
# Run `wlr-randr` to get your monitors information.
# You will have to remove "#" and edit it for it to take effect.

#monitorrule = name:HEADLESS-4, width:3440, height:1440, refresh:180, x:0, y:0, rr:0, vrr:1
monitorrule = name:DP-1, width:3440, height:1440, refresh:180, x:0, y:0, vrr:0, rr:0, hdr:1
monitorrule = name:DP-2, width:2560, height:1440, refresh:59.951, x:3440, y:0, vrr:0, rr:0, hdr:1

hdr_depth = 2

# | Input Devices |
# Configure your input devices here. | https://mangowm.github.io/docs/configuration/input

numlockon=1

# xkb_rules_layout = us

# If you want to disable pointer acceleration, uncomment the lines below.
# accel_profile = 1
# accel_speed = 0.2

# https://mangowm.github.io/docs/configuration/miscellaneous

allow_tearing = 2
syncobj_enable = 1
# xwayland-persistence = 1

drag_tile_to_tile = 1

# Sources
source=~/.config/mango/source/cursor.conf
source=~/.config/mango/source/bind.conf
source=~/.config/mango/source/rules.conf
source=~/.config/mango/source/looks.conf
source=~/.config/mango/source/animation.conf
source=~/.config/mango/source/layout.conf
source=~/.config/mango/source/auto-start.conf

source=/home/lemontree/.config/mango/noctalia.conf
