# autostart your favorite applications here

 #exec-once = bash -c wl-paste --watch cliphist store &  # optional: clipboard history | cliphist is needed
exec-once = noctalia &
exec-once = /usr/lib/xdg-desktop-portal &
 #exec-once = /usr/lib/xdg-desktop-portal-gtk &
exec-once = /usr/lib/xdg-desktop-portal-kde &
exec-once = /usr/lib/xdg-desktop-wlr &
 #exec-once = /usr/lib/xdg-desktop-portal-gnome &
 #exec-once = bash -c "sleep 1 && foot btop" &
 #exec-once = bash -c "sleep 1 && foot nvtop" &
 #exec-once = bash -c "sleep 1.5 && foot cava" &
 #exec-once = bash -c "sleep 1.5 && foot unimatrix -n -s 96 -l o" &
 #exec-once = bash -c "sleep 2 && foot" &
exec-once = bash -c "sleep 0.5 && protonvpn-app" &
exec-once = bash -c "sleep 2 && steam" &
 #exec-once = bash -c "sleep 2 && equibop" &
 #exec-once = bash -c "sleep 3 && zen-browser" &

# Change your layout here for each workspace.
# tile, scroller, grid, deck, monocle, center_tile, vertical_tile, vertical_scroller

circle_layout = scroller,fair

# Monitor DP-1
tagrule = id:1, monitor_name:DP-1, layout_name:fair
tagrule = id:2, monitor_name:DP-1, layout_name:scroller
tagrule = id:3, monitor_name:DP-1, layout_name:scroller
tagrule = id:4, monitor_name:DP-1, layout_name:fair
tagrule = id:5, monitor_name:DP-1, layout_name:scroller
tagrule = id:6, monitor_name:DP-1, layout_name:scroller
tagrule = id:7, monitor_name:DP-1, layout_name:scroller
tagrule = id:8, monitor_name:DP-1, layout_name:scroller
tagrule = id:9, monitor_name:DP-1, layout_name:scroller

# Monitor DP-2
tagrule = id:1, monitor_name:DP-2, layout_name:fair
tagrule = id:2, monitor_name:DP-2, layout_name:fair
tagrule = id:3, monitor_name:DP-2, layout_name:fair
tagrule = id:4, monitor_name:DP-2, layout_name:fair
tagrule = id:5, monitor_name:DP-2, layout_name:fair
tagrule = id:6, monitor_name:DP-2, layout_name:fair
tagrule = id:7, monitor_name:DP-2, layout_name:fair
tagrule = id:8, monitor_name:DP-2, layout_name:fair
tagrule = id:9, monitor_name:DP-2, layout_name:fair

# Overview
enable_hotarea = 0
ov_tab_mode = 0
overviewgappi =30
overviewgappo = 50

# Snap
enable_floating_snap = 1
snap_distance = 100

# | Environment Variables |
# Set your environment variables here. | https://mangowm.github.io/docs/configuration/basics#environment-variables

env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME_QT6,qt6ct
 #env = WLR_DRM_NO_ATOMIC,1
 #WLR_DRM_DEVICES=/dev/dri/card0:/dev/dri/card1 mango
 #WLR_DRM_DEVICES=/dev/dri/card0 mango
env = WLR_RENDERER,vulkan

# | Outputs Configuration |
# Configure your monitors here or in the DMS "Displays" settings. | https://mangowm.github.io/docs/configuration/monitors
# Run `wlr-randr` to get your monitors information.
# You will have to remove "#" and edit it for it to take effect.

#monitorrule = name:HEADLESS-4, width:3440, height:1440, refresh:180, x:0, y:0, rr:0, vrr:1
monitorrule = name:DP-1, width:3440, height:1440, refresh:180, x:0, y:0, vrr:0, rr:0, hdr:1
monitorrule = name:DP-2, width:2560, height:1440, refresh:59.951, x:3440, y:0, vrr:0, rr:0, hdr:1

# | Input Devices |
# Configure your input devices here. | https://mangowm.github.io/docs/configuration/input

numlockon=1

# xkb_rules_layout = us

# If you want to disable pointer acceleration, uncomment the lines below.
# accel_profile = 1
# accel_speed = 0.2

# | Layout |
# layouts | https://mangowm.github.io/docs/window-management/layouts

# Scrolling layout settings.
scroller_structs = 20
scroller_default_proportion = 0.714
scroller_focus_center = 0
scroller_prefer_center = 0
scroller_prefer_overspread = 1
edge_scroller_pointer_focus = 0
scroller_ignore_proportion_single = 0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = 0.286, 0.427, 0.573, 0.714

# Master-Stack layout settings.
new_is_master = 1
default_mfact = 0.55
default_nmaster = 1
smartgaps = 0


# https://mangowm.github.io/docs/configuration/miscellaneous

allow_tearing = 1
# syncobj_enable = 1
# xwayland-persistence = 1

drag_tile_to_tile = 1

# Scratchpad
scratchpad_cross_monitor = 0
single_scratchpad = 1

# Sources
source=~/.config/mango/cursor.conf
source=~/.config/mango/bind.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/looks.conf
source=~/.config/mango/animation.conf

source=/home/lemontree/.config/mango/noctalia.conf
