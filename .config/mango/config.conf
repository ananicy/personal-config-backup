# | Environment Variables |
# Set your environment variables here. | https://mangowm.github.io/docs/configuration/basics#environment-variables

env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME_QT6,qt6ct
env = WLR_RENDERER,vulkan

# | Outputs Configuration |
# Configure your monitors here or in the DMS "Displays" settings. | https://mangowm.github.io/docs/configuration/monitors
# Run `wlr-randr` to get your monitors information.
# You will have to remove "#" and edit it for it to take effect.

monitor_rule = name:DP-1, width:3440, height:1440, refresh:180, x:6000, y:0, vrr:1, rr:0, hdr:1
monitor_rule = name:DP-2, width:3840, height:2160, refresh:59.997002, x:0, y:0, vrr:1, rr:1, hdr:1
monitor_rule = name:HDMI-A-1, width:3440, height:1440, refresh:100, x:9000, y:0, vrr:1, rr:0, hdr:1

hdr_depth = 2
allow_tearing = 2

# System & Hardware

xwayland_persistence = 1
sync_obj_enable = 1
allow_lock_transparent = 0
allow_shortcuts_inhibit = 1
auto_reload_config = 1

# Focus & Input

focus_on_activate = 1
sloppy_focus = 1
warp_cursor = 1
cursor_hide_timeout = 0
cursor_hide_on_keypress = 0
drag_tile_to_tile = 1
drag_tile_small = 0
drag_corner = 3
drag_warp_cursor = 1
axis_bind_apply_timeout = 100

# Multi-Monitor & Tags

focus_cross_monitor = 1
exchange_cross_monitor = 1
focus_cross_tag = 0
view_current_to_back = 0
scratchpad_cross_monitor = 0
single_scratchpad = 1

# Window Behavior

enable_floating_snap = 1
snap_distance = 100
float_full_to_top = 1
no_border_when_single = 0
idle_inhibit_ignore_visible = 0
tag_carousel = 0

# Sources
source=~/.config/mango/source/cursor.conf
source=~/.config/mango/source/bind.conf
source=~/.config/mango/source/rules.conf
source=~/.config/mango/source/looks.conf
source=~/.config/mango/source/animation.conf
source=~/.config/mango/source/layout.conf
source=~/.config/mango/source/auto-start.conf
source=~/.config/mango/noctalia.conf
