# | Rules |
# Window/Tag/Layer rules. | https://mangowm.github.io/docs/window-management/rules

# | Steam |
window_rule = is_floating:1, app_id:[Ss]team
window_rule = tags:2, is_floating:0, scroller_proportion:0.573, title:Steam
window_rule = is_floating:0, scroller_proportion:0.573, app_id:steam, title:Recordings & Screenshots
window_rule = is_floating:1, app_id:steam, title:Steam Settings
window_rule = scroller_proportion:0.286, is_floating:0, width:0.25, height:0.75, title:Friends List
window_rule = scroller_proportion:1, is_floating:0, width:0.25, height:0.75, title:EasyGrid
window_rule = tags:2, monitor:DP-1, confine_pointer:0, app_id:^gamescope$
window_rule = tags:2, monitor:DP-1, confine_pointer:0, app_id:^broken$
window_rule = tags:2, is_fullscreen:1, vrr_only_fullscreen:1, is_floating:0, force_render:1, confine_pointer:1, app_id:^steam_app.*$
