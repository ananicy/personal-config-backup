# | Rules |
# Window/Tag/Layer rules. | https://mangowm.github.io/docs/window-management/rules

# | Steam |
windowrule = isfloating:1, appid:[Ss]team
windowrule = tags:2, isfloating:0, scroller_proportion:0.573, title:Steam
windowrule = isfloating:0, scroller_proportion:0.573, appid:steam, title:Recordings & Screenshots
windowrule = isfloating:1, appid:steam, title:Steam Settings
windowrule = scroller_proportion:0.286, isfloating:0, width:0.25, height:0.75, title:Friends List
# | Noctalia |
windowrule = scroller_proportion:0.427, title:Noctalia Settings
# | Mission Center |
windowrule = tags:1, scroller_proportion:0.427, appid:io.missioncenter.MissionCenter
# | Text Editor |
windowrule = width:0.5, height:0.75, scroller_proportion:0.427, appid:org.gnome.TextEditor
windowrule = width:0.25, height:0.5, isfloating:1, scroller_proportion:0.427, appid:elisa
# | Dolphin |
windowrule = width:0.5, height:0.75, scroller_proportion:0.427, appid:org.kde.dolphin
windowrule = width:0.5, height:0.75, scroller_proportion:0.427, appid:org.freedesktop.impl.portal.desktop.kde
# | Nautilus |
windowrule = width:0.5, height:0.75, scroller_proportion:0.427, appid:org.gnome.Nautilus
