# Change your layout here for each workspace.
# tile, scroller, grid, deck, monocle, center_tile, vertical_tile, vertical_scroller

circle_layout = scroller,fair,grid

# Monitor DP-1
tagrule = id:1, monitor_name:DP-1, layout_name:grid
tagrule = id:2, monitor_name:DP-1, layout_name:scroller
tagrule = id:3, monitor_name:DP-1, layout_name:fair
tagrule = id:4, monitor_name:DP-1, layout_name:fair
tagrule = id:5, monitor_name:DP-1, layout_name:scroller
tagrule = id:6, monitor_name:DP-1, layout_name:scroller
tagrule = id:7, monitor_name:DP-1, layout_name:scroller
tagrule = id:8, monitor_name:DP-1, layout_name:scroller
tagrule = id:9, monitor_name:DP-1, layout_name:scroller

# Monitor DP-2
tagrule = id:1, monitor_name:DP-2, layout_name:fair
tagrule = id:2, monitor_name:DP-2, layout_name:fair
tagrule = id:3, monitor_name:DP-2, layout_name:fair
tagrule = id:4, monitor_name:DP-2, layout_name:fair
tagrule = id:5, monitor_name:DP-2, layout_name:fair
tagrule = id:6, monitor_name:DP-2, layout_name:fair
tagrule = id:7, monitor_name:DP-2, layout_name:fair
tagrule = id:8, monitor_name:DP-2, layout_name:fair
tagrule = id:9, monitor_name:DP-2, layout_name:fair

# Overview
enable_hotarea = 0
ov_tab_mode = 0
overviewgappi =30
overviewgappo = 50

# Snap
enable_floating_snap = 1
snap_distance = 100

# | Layout |
# layouts | https://mangowm.github.io/docs/window-management/layouts

# Scrolling layout settings.
scroller_structs = 20
scroller_default_proportion = 0.714
scroller_focus_center = 0
scroller_prefer_center = 0
scroller_prefer_overspread = 1
edge_scroller_pointer_focus = 0
scroller_ignore_proportion_single = 0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = 0.286, 0.427, 0.573, 0.714

# Master-Stack layout settings.
new_is_master = 1
default_mfact = 0.55
default_nmaster = 1
smartgaps = 0

# Scratchpad
scratchpad_cross_monitor = 0
single_scratchpad = 1
