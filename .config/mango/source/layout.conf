# Change your layout here for each workspace.
# tile, scroller, monocle, grid, deck, center_tile, vertical_tile, right_tile, vertical_scroller, vertical_grid, vertical_deck, dwindle, fair, vertical_fair

circle_layout = scroller,fair,grid

# Monitor DP-1
tag_rule = id:0, monitor_name:DP-1, layout_name:grid
tag_rule = id:1, monitor_name:DP-1, layout_name:fair
tag_rule = id:2, monitor_name:DP-1, layout_name:scroller
tag_rule = id:3, monitor_name:DP-1, layout_name:monocle
tag_rule = id:4, monitor_name:DP-1, layout_name:scroller
tag_rule = id:5, monitor_name:DP-1, layout_name:scroller
tag_rule = id:6, monitor_name:DP-1, layout_name:scroller
tag_rule = id:7, monitor_name:DP-1, layout_name:scroller
tag_rule = id:8, monitor_name:DP-1, layout_name:scroller
tag_rule = id:9, monitor_name:DP-1, layout_name:scroller

# Monitor DP-2
tag_rule = id:*, monitor_name:DP-2, layout_name:vertical_scroller

# Overview
enable_hotarea = 0
hotarea_size = 10
hotarea_corner = 2
overview_gap_inner =30
overview_gap_outer = 50

# | Layout |
# layouts | https://mangowm.github.io/docs/window-management/layouts

# Scrolling layout settings.
scroller_structs = 20
scroller_default_proportion = 0.714
scroller_focus_center = 0
scroller_prefer_center = 0
scroller_prefer_overspread = 1
edge_scroller_pointer_focus = 0
scroller_ignore_proportion_single = 1
scroller_default_proportion_single = 1.0
scroller_proportion_preset = 0.714, 0.578, 0.422, 0.286

# Master-Stack layout settings.
new_is_master = 1
default_master_factor = 0.5
default_master_count = 1
smart_gaps = 0

#Monocle
monocle_tab_mode = 1
monocle_right_button_close = 0
monocle_no_border = 1
monocle_no_gap = 1

#Deck
deck_tab_mode = 1
