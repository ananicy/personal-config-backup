# | Keybinds |
# Configure your keybinds here. | https://mangowm.github.io/docs/bindings/keys

# Your favorite applications. Free binds ()
bind = SUPER, Return, spawn, foot
bind = SUPER, e, spawn, nautilus
bind = SUPER, b, spawn, zen-browser
bind = SUPER, d, spawn, equibop
bind = SUPER, i, spawn, qpwgraph
bind = SUPER, t, spawn, tauonmb
bind = SUPER, z, toggle_named_scratchpad, foot-scratch, none, foot --app-id foot-scratch

# Please choose the text editor of your choice.
 # bind = SUPER, x, spawn, alacritty -e nvim

# Noctalia specific keybinds.
bind = SUPER, space, spawn, noctalia msg panel-toggle launcher
bind = SUPER, a, spawn, noctalia msg panel-toggle alexander/game-launcher:browser
bind = SUPER, y, spawn, noctalia msg panel-toggle nightwatch75/file-search:panel
bind = SUPER, c, spawn, noctalia msg panel-toggle clipboard
bind = SUPER, m, spawn, noctalia msg panel-toggle control-center audio
bind = SUPER, k, spawn, noctalia msg settings-toggle
 #bind = SUPER, l, spawn, noctalia msg panel-toggle control-center notifications
 #bind = SUPER, l, switch_layout
bind = SUPER, l, spawn, noctalia msg panel-toggle blackbartblues/keymap:panel
bind = SUPER, w, spawn, noctalia msg panel-toggle wallpaper
bind = SUPER+SHIFT, q, spawn, noctalia msg panel-toggle session
bind = SUPER, u, spawn, noctalia msg bar-toggle Bar
bind = SUPER, u, spawn, noctalia msg bar-toggle 2nd-Bar
bind = SUPER, u, spawn, noctalia msg bar-toggle 3rd-Bar
bind = SUPER, h, spawn, noctalia msg panel-toggle noctalia/notes:panel
bind = SUPER, s, spawn, noctalia msg panel-toggle control-center

bind = SUPER, F12, spawn, noctalia msg media previous-player
bind = SUPER, F11, spawn, noctalia msg media next-player
bind = SUPER, f9, spawn, noctalia msg media toggle
bind = SUPER, F8, spawn, noctalia msg media previous
bind = SUPER, F10, spawn, noctalia msg media next

# Lockscreen
#bind = SUPER+ALT, l, spawn, dms ipc call lock lock
bind = SUPER+SHIFT, m, quit

# Noctalia services
#bind = SUPER, p, spawn, ~/.config/mango/scripts/screenshot.sh
bind = SUPER, p, spawn, noctalia msg screenshot-region Screenshot
bind = SUPER+SHIFT, p, spawn, noctalia msg screenshot-fullscreen pick
bind = SUPER+SHIFT, b, spawn, noctalia msg plugin noctalia/screen_recorder:service all replay-toggle
bind = SUPER+SHIFT, s, spawn, noctalia msg plugin noctalia/screen_recorder:service all replay-save

bind = SUPER+SHIFT, B, spawn, plugin noctalia/screen_recorder:service all replay-toggle
# Reload config
bind = SUPER, r, reload_config
#bind = SUPER, r, spawn, noctalia msg config-reload
bind = SUPER+SHIFT, r, spawn, noctalia msg greeter-sync

# Audio controls
bind = NONE, XF86AudioRaiseVolume, spawn, noctalia msg volume-up 5
bind = NONE, XF86AudioLowerVolume, spawn, noctalia msg volume-down 5
 #bind = NONE, XF86AudioMute, spawn, dms ipc call audio mute

# Brightness controls
 #bind = NONE, XF86MonBrightnessUp, spawn, dms ipc call brightness increment 5
 #bind = NONE, XF86MonBrightnessDown, spawn, dms ipc call brightness decrement 5

bind = SUPER, q, killclient
bind = SUPER+CTRL, q, killclient, force

# Switch window focus
bind = SUPER, Tab, focusstack, next
bind = SUPER, Left, focusdir, left
bind = SUPER, Right, focusdir, right
bind = SUPER, Up, focusdir, up
bind = SUPER, Down, focusdir, down

# Stack window
bind = super+ctrl, up, scroller_stack, left
bind = super+ctrl, down, scroller_stack, right

axisbind = SUPER, Up, focusdir, left
axisbind = SUPER, Down, focusdir, right

# Swap window
bind = SUPER+SHIFT, Up, exchange_client, up
bind = SUPER+SHIFT, Down, exchange_client, down
bind = SUPER+SHIFT, Left, exchange_client, left
bind = SUPER+SHIFT, Right, exchange_client, right

# Switch window status
bind = SUPER, g, toggleglobal,
bind = ALT, Tab, togglejump
bind = SUPER, v, togglefloating,
bind = SUPER, f, togglemaximizescreen,
bind = SUPER+SHIFT, f, togglefullscreen,
bind = SUPER+ALT, f, togglefakefullscreen,
bind = SUPER, j, minimized,
 #bind = SUPER, o, toggleoverlay,
bind = SUPER+SHIFT, j, restore_minimized
bind = SUPER, n, toggle_scratchpad

# Scroller layout
bind = SUPER+SHIFT, e, set_proportion, 1.0
bind = SUPER, x, switch_proportion_preset

# Switch layout
bind = SUPER, o, switch_layout

# Switch between workspaces
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0

bind = SUPER, next, viewtoright
bind = SUPER, prior, viewtoleft

# Tag: move client to another workspace.
# Tagsilent: move client to another workspace but do not focus it.
# E.g bind = SUPER+SHIFT, 1, tagsilent, 1
bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0

# Switch between monitors
bind = SUPER+CTRL+SHIFT, Left, focusmon, left
bind = SUPER+CTRL+SHIFT, Right, focusmon, right
bind = SUPER+CTRL+SHIFT, Down, focusmon, down
bind = SUPER+CTRL+SHIFT, Up, focusmon, up

# Move window to another monitor
bind = SUPER+CTRL, Left, tagmon, left
bind = SUPER+CTRL, Right, tagmon, right

# Group
bind = SUPER+ALT+SHIFT, Left, groupjoin, left
bind = SUPER+ALT+SHIFT, Right, groupjoin, right
bind = SUPER+ALT+SHIFT, Down, groupjoin, down
bind = SUPER+ALT+SHIFT, Up, groupjoin, up

#bind = SUPER+ALT+SHIFT, bracketright, groupfocus, next
#bind = SUPER+ALT+SHIFT, bracketleft, groupfocus, prev
bind = SUPER+ALT+SHIFT, next, groupfocus, next
bind = SUPER+ALT+SHIFT, prior, groupfocus, prev
bind = SUPER+ALT+SHIFT, delete, groupleave

# Gaps
 #bind = SUPER+SHIFT, X, incgaps, 1
 #bind = SUPER+SHIFT, Z, incgaps, -1
 #bind = SUPER+SHIFT, R, togglegaps

# Movewin
 #bind = CTRL+SHIFT, Up, movewin, +0, -50
 #bind = CTRL+SHIFT, Down, movewin, +0, +50
 #bind = CTRL+SHIFT, Left, movewin, -50,+0
 #bind = CTRL+SHIFT, Right, movewin, +50,+0

bind = CTRL+SHIFT, Up, smartmovewin, Up
bind = CTRL+SHIFT, Down, smartmovewin, Down
bind = CTRL+SHIFT, Left, smartmovewin, Left
bind = CTRL+SHIFT, Right, smartmovewin, Right

# Resizewin
bind = SUPER+ALT, Up, resizewin, +0, -166
bind = SUPER+ALT, Down, resizewin, +0, +166
bind = SUPER+ALT, Left, resizewin, -166, +0
bind = SUPER+ALT, Right, resizewin, +166, +0

# Mouse Button Bindings.
# btn_left and btn_right can't bind none mod key
mousebind = SUPER, btn_left, moveresize,curmove
mousebind = SUPER, btn_middle, togglemaximizescreen
mousebind = SUPER, btn_right, moveresize, curresize

