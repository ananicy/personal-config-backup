# noctalia-greeter sync.toml (UI + Sync; not managed by Nix)
# [session] last, [session.power] suspend/reboot/shutdown, [[session.actions]] action/command/label/glyph
# [appearance] scheme, theme_mode, corner_radius_scale, font_family
# [appearance.palette] full color role table, [appearance.wallpaper]/[appearance.wallpapers.<connector>]
# [output] layout/transforms/scales

[appearance]
corner_radius_scale = 1.0
font_family = "Noto Sans Mono"
scheme = "Synced"
theme_mode = "dark"

    [appearance.palette]
    error = "#FFB4AB"
    hover = "#D4C78E"
    on_error = "#690005"
    on_hover = "#383006"
    on_primary = "#552008"
    on_secondary = "#442A20"
    on_surface = "#F1DFD9"
    on_surface_variant = "#D8C2BA"
    on_tertiary = "#383006"
    outline = "#53433E"
    primary = "#FFB598"
    secondary = "#E7BEAE"
    shadow = "#000000"
    surface = "#1A110E"
    surface_variant = "#271E1A"
    tertiary = "#D4C78E"

    [appearance.wallpaper]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper.jpg"

    [appearance.wallpapers.DP-1]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper-DP-1.jpg"

    [appearance.wallpapers.DP-2]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper-DP-2.jpg"

    [appearance.wallpapers.HDMI-A-1]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper-HDMI-A-1.jpg"

[output]
layout = "DP-2:0,0; DP-1:1440,0"
scales = "DP-1:1.000; DP-2:1.000"
transforms = "DP-1:normal; DP-2:90"

[session]
last = "Mango"

    [[session.actions]]
    action = "lock"

    [[session.actions]]
    action = "logout"

    [[session.actions]]
    action = "suspend"

    [[session.actions]]
    action = "reboot"

    [[session.actions]]
    action = "shutdown"

    [[session.actions]]
    action = "command"
    command = "systemctl reboot --firmware-setup"
    glyph = "artboard"
    label = "UEFI"

    [[session.actions]]
    action = "command"
    command = "killall mango"
    glyph = "terminal-2"
    label = "TTY"