# noctalia-greeter sync.toml (UI + Sync; not managed by Nix)
# [session] last, [session.power] suspend/reboot/shutdown, [[session.actions]] action/command/label/glyph
# [appearance] scheme, theme_mode, corner_radius_scale, font_family
# [appearance.palette] full color role table, [appearance.wallpaper]/[appearance.wallpapers.<connector>]
# [output] layout/transforms/scales

[appearance]
corner_radius_scale = 1.0
font_family = "Noto Sans Mono"
scheme = "Synced"
theme_mode = "dark"

    [appearance.palette]
    error = "#FFB4AB"
    hover = "#EDB8CC"
    on_error = "#690005"
    on_hover = "#482535"
    on_primary = "#31285F"
    on_secondary = "#312E41"
    on_surface = "#E6E1E9"
    on_surface_variant = "#C9C5D0"
    on_tertiary = "#482535"
    outline = "#48454E"
    primary = "#C9BEFF"
    secondary = "#C9C3DC"
    shadow = "#000000"
    surface = "#141318"
    surface_variant = "#201F25"
    tertiary = "#EDB8CC"

    [appearance.wallpaper]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper.jpeg"

    [appearance.wallpapers.DP-1]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper-DP-1.jpg"

    [appearance.wallpapers.DP-2]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper-DP-2.jpg"

[output]
layout = "DP-1:0,0; DP-2:6000,0"
scales = "DP-1:1.000; DP-2:1.500"
transforms = "DP-1:normal; DP-2:90"

[session]
last = "Mango"

    [[session.actions]]
    action = "lock"

    [[session.actions]]
    action = "logout"

    [[session.actions]]
    action = "suspend"

    [[session.actions]]
    action = "reboot"

    [[session.actions]]
    action = "shutdown"

    [[session.actions]]
    action = "command"
    command = "systemctl reboot --firmware-setup"
    glyph = "artboard"
    label = "UEFI"

    [[session.actions]]
    action = "command"
    command = "killall mango"
    glyph = "terminal-2"
    label = "TTY"