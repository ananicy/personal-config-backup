# noctalia-greeter sync.toml (UI + Sync; not managed by Nix)
# [session] last, [session.power] suspend/reboot/shutdown, [[session.actions]] action/command/label/glyph
# [appearance] scheme, theme_mode, corner_radius_scale, font_family
# [appearance.palette] full color role table, [appearance.wallpaper]/[appearance.wallpapers.<connector>]
# [output] layout/transforms

[appearance]
corner_radius_scale = 1.0
font_family = "FantasqueSansM Nerd Font Mono"
scheme = "Synced"
theme_mode = "dark"

    [appearance.palette]
    error = "#FFB4AB"
    hover = "#A3D0BF"
    on_error = "#690005"
    on_hover = "#08372B"
    on_primary = "#303300"
    on_secondary = "#313219"
    on_surface = "#E5E3D6"
    on_surface_variant = "#C9C7B6"
    on_tertiary = "#08372B"
    outline = "#47473B"
    primary = "#C7CC79"
    secondary = "#C8C9A6"
    shadow = "#000000"
    surface = "#14140C"
    surface_variant = "#202018"
    tertiary = "#A3D0BF"

    [appearance.wallpaper]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper.jpg"

    [appearance.wallpapers.DP-1]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper-DP-1.jpg"

    [appearance.wallpapers.DP-2]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper-DP-2.jpg"

[output]
layout = "DP-1:0,360; DP-2:3440,0"
transforms = "DP-1:normal; DP-2:normal"

[session]
last = "Mango"

    [[session.actions]]
    action = "lock"

    [[session.actions]]
    action = "logout"

    [[session.actions]]
    action = "suspend"

    [[session.actions]]
    action = "reboot"

    [[session.actions]]
    action = "shutdown"

    [[session.actions]]
    action = "command"
    command = "systemctl reboot --firmware-setup"
    glyph = "artboard"
    label = "UEFI"

    [[session.actions]]
    action = "command"
    command = "killall mango"
    glyph = "terminal-2"
    label = "TTY"